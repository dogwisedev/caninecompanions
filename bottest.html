<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dogwise Academy Chat</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f5f5f7;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .chat-container {
    width: 400px;
    max-width: 90%;
    height: 600px;
    display: flex;
    flex-direction: column;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    overflow: hidden;
  }

  .chat-header {
    background-color: #4a90e2;
    color: white;
    padding: 16px;
    font-size: 1.2em;
    font-weight: bold;
    text-align: center;
  }

  .chat-output {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    background-color: #f0f4f8;
  }

  .message {
    margin-bottom: 12px;
    line-height: 1.4;
  }

  .message.user {
    text-align: right;
  }

  .message.user strong {
    color: #4a90e2;
  }

  .message.ai strong {
    color: #27ae60;
  }

  .chat-input-container {
    display: flex;
    border-top: 1px solid #ddd;
    padding: 8px;
    background-color: #fafafa;
  }

  .chat-input-container input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    outline: none;
    font-size: 1em;
  }

  .chat-input-container button {
    margin-left: 8px;
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background-color: #4a90e2;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
  }

  .chat-input-container button:hover {
    background-color: #357ab8;
  }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">Dogwise Academy Chat</div>
  <div id="output" class="chat-output"></div>
  <div class="chat-input-container">
    <input id="input" type="text" placeholder="Type your message..." />
    <button id="send">Send</button>
  </div>
</div>

<script>
// ---- Your JS goes here (popup.js logic) ----

// Example: simplified for testing UI
const API_KEY = "YOUR_KEY_HERE"; // replace with your Groq key

const sendButton = document.getElementById("send");
const inputBox = document.getElementById("input");
const outputDiv = document.getElementById("output");

// Conversation history
let conversation = [
  {
    role: "system",
    content: `Role: You are Alma, a Training Consultant at Dogwise Academy. Speak professionally, empathetically, first-person, and occasionally inject gentle humor. Keep responses concise and focused. Never reveal you are an AI.`
  }
];

// Append message
function appendMessage(role, content) {
  const message = document.createElement("div");
  message.className = `message ${role}`;
  message.innerHTML = role === "user"
    ? `<strong>You:</strong> ${content}`
    : `<strong>AI:</strong> ${content}`;
  outputDiv.appendChild(message);
  outputDiv.scrollTop = outputDiv.scrollHeight;
}

// Send message
sendButton.addEventListener("click", async () => {
  const userMessage = inputBox.value.trim();
  if (!userMessage) return;
  conversation.push({ role: "user", content: userMessage });
  appendMessage("user", userMessage);
  inputBox.value = "";

  const loadingMessage = document.createElement("div");
  loadingMessage.className = "message ai";
  loadingMessage.innerHTML = "<strong>AI:</strong> Thinking...";
  outputDiv.appendChild(loadingMessage);
  outputDiv.scrollTop = outputDiv.scrollHeight;

  try {
    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${API_KEY}`
      },
      body: JSON.stringify({
        model: "llama-3.1-8b-instant",
        messages: conversation,
        max_tokens: 120,
        temperature: 0.35
      })
    });

    const data = await response.json();
    const reply = data.choices[0].message.content;
    conversation.push({ role: "assistant", content: reply });
    loadingMessage.innerHTML = `<strong>AI:</strong> ${reply}`;

  } catch (err) {
    loadingMessage.innerHTML = "<strong>AI:</strong> Request failed: " + err.message;
  }
});
</script>

</body>
</html>
