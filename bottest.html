    display: flex; gap: 4px; align-items: center;
    padding: 14px 16px;
  }
  .typing-dots span {
    width: 7px; height: 7px;
    background: var(--border);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {

  }

  /* ── Input area ── */
  .input-area {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    background: var(--white);
    flex-shrink: 0;
  }
  .input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 22px;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    resize: none;
    outline: none;
    line-height: 1.4;
    max-height: 120px;
    min-height: 42px;
    overflow-y: auto;

    padding: 8px 16px;
    color: var(--muted);
    max-height: 80px;
    overflow-y: auto;
    flex-shrink: 0;

function haversine(lat1, lon1, lat2, lon2) {
  const R = 3958.8, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

const zipCache = {};
async function zipToCoords(zip) {
  if (zipCache[zip]) return zipCache[zip];
  try {
    const r = await fetch(`https://api.zippopotam.us/us/${zip}`);
    if (!r.ok) return null;
    const d = await r.json();
    if (!d.places?.[0]) return null;
    const result = { lat: parseFloat(d.places[0].latitude), lon: parseFloat(d.places[0].longitude), city: d.places[0]["place name"], state: d.places[0]["state abbreviation"] };
    zipCache[zip] = result;
    return result;
  } catch { return null; }
}

function closestTrainer(userLat, userLon) {
  let best = null, bestDist = Infinity;
  for (const t of TRAINERS) {
    const d = haversine(userLat, userLon, t.lat, t.lon);
    if (d < bestDist) { bestDist = d; best = t; }
  }
  return best ? { ...best, distanceMiles: Math.round(bestDist) } : null;
}

function getPricingContext(rec, stateAbb) {

  const price = (rec.weeks * 1000 * (isPremium ? 1.1 : 1.0)).toLocaleString();
  return `The ${rec.program} (${rec.weeks} weeks) is $${price}${isPremium ? " (premium market rate)" : ""}. There's a $1,000 deposit to hold the spot, and payment plans are available.`;
}

function getRecommendation() {
  const a = profile.ageMonths;
  if (a === null) return null;

  // Unsupported requests → we pivot, never just refuse
  // (handled in conversation, not here)

  // Aggression track

    // Excitement bite in young dog (accidental break, no real aggression intent)

      return { program: "Adolescent Essentials", weeks: 3,

    }
    // Real skin break

      return { program: "Reactivity & Aggression Reset", weeks: 6,
        reason: "bite with broken skin requires the full 6-week program" };
    }
    // Aggression, no break — age modifier
    const weeks = a >= 48 ? 6 : 5; // 4+ years → 6 weeks
    return { program: "Reactivity & Aggression Reset", weeks,
      reason: a >= 48 ? "older dog with established aggression patterns needs 6 weeks" : "aggression without skin break" };
  }

  // Anxiety — only after sift confirms it's real
  if (profile.realAnxiety === true) {
    return { program: "Anxiety Support", weeks: 4,
      reason: "confirmed anxiety triggers — separation, storms, panic responses" };
  }

  // Rescue Restart — unknown background + shut down/skittish
  if (profile.isRescue && profile.rescueRestart === true) {
    return { program: "Rescue Restart", weeks: 4,
      reason: "rescue with unknown history and classic shut-down/fearful behaviour" };
  }

  // Puppy track
  if (a <= 6) {
    if (profile.isLargeBreed) {
      return { program: "Big Puppy", weeks: 3,
        reason: "large breed puppy — needs structure before size becomes a problem" };
    }
    return { program: "Puppy Foundations", weeks: 2,
      reason: "young puppy, basic foundation and house manners" };
  }

  // 6–12 months — no aggression/anxiety
  if (a <= 12) {
    return { program: "Adolescent Essentials", weeks: 3,
      reason: "adolescent phase — building manners and impulse control" };
  }

  // 12 months+ with solid obedience but needs real-world control
  if (profile.hasObedience && (profile.isLargeBreed || a > 18)) {
    return { program: "Strong Companion", weeks: 4,
      reason: "knows the basics but needs reliability in the real world" };
  }

  // 12 months+ standard
  return { program: "Adolescent Essentials", weeks: a <= 18 ? 3 : 4,
    reason: "adult dog needing structure and reliable obedience" };
}

async function extractProfile(userMessage) {
  try {
    const res = await fetch(GROQ_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${GROQ_KEY}` },
      body: JSON.stringify({
        model: "llama-3.3-70b-versatile",
        temperature: 0,
        max_tokens: 400,
        messages: [
          { role: "system", content: `Extract dog profile data from a customer message. Return ONLY valid JSON with these exact fields (use null if unknown, false for booleans if not mentioned):
{
  "ageMonths": number or null,
  "isLargeBreed": boolean or null,
  "breed": string or null,
  "hasAggression": boolean,
  "biteHistory": boolean,
  "skinBroken": boolean,
  "excitementBite": boolean,
  "hasAnxiety": boolean,
  "isRescue": boolean,
  "hasObedience": boolean,
  "zip": string or null,
  "cityMentioned": string or null
}
Large breeds: Rottweiler, Pitbull, GSD, Mastiff, Great Dane, Doberman, Cane Corso, Bullmastiff, Bernese, Saint Bernard, Weimaraner, Ridgeback, Dogo Argentino.
Age clues: "puppy"=3, "8 weeks"=2, "4 months"=4, "6 months"=6, "1 year"=12, "18 months"=18, "2 years"=24, "3 years"=36, "4 years"=48.
excitementBite=true only if young + described as accidental/play/excited + no aggression pattern.
zip: 5-digit US ZIP if mentioned. cityMentioned: city name if mentioned.
Return ONLY the JSON object. No markdown, no explanation.` },
          { role: "user", content: userMessage }
        ]
      })
    });
    const data = await res.json();
    const text = data.choices?.[0]?.message?.content || "{}";
    return JSON.parse(text.replace(/```json|```/g, "").trim());
  } catch(e) {
    log("Extract err: " + e.message);
    return null;
  }
}

// ── Main reply ───────────────────────────────────────────────
async function getAlmaReply() {
  try {
    const res = await fetch(GROQ_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${GROQ_KEY}` },
      body: JSON.stringify({
        model: "llama-3.3-70b-versatile",
        temperature: 0.5,
        max_tokens: 1000,
        messages: [
          { role: "system", content: buildSystemPrompt() },
          ...history
        ]
      })
    });
    const data = await res.json();
    return data.choices?.[0]?.message?.content || "Sorry, missed that — can you say it again?";
  } catch(e) {
    log("Reply error: " + e.message);
    return "Connection blip — give me a second and try again!";
  }
}

// ── Send flow ────────────────────────────────────────────────
async function send() {
  const text = inputEl.value.trim();
  if (!text) return;

  inputEl.value = "";
  inputEl.style.height = "42px";
  sendBtn.disabled = true;

  addBubble("user", text);
  history.push({ role: "user", content: text });

  showTyping();

  // Extract profile first so system prompt has fresh data
  const extracted = await extractProfile(text);

  // Merge extracted profile
  if (extracted) {
    if (extracted.ageMonths != null)    profile.ageMonths    = extracted.ageMonths;
    if (extracted.isLargeBreed != null) profile.isLargeBreed = extracted.isLargeBreed;
    if (extracted.breed)                profile.breed        = extracted.breed;
    if (extracted.hasAggression)        profile.hasAggression  = true;
    if (extracted.biteHistory)          profile.biteHistory    = true;
    if (extracted.skinBroken)           profile.skinBroken     = true;
    if (extracted.excitementBite)       profile.excitementBite = true;
    if (extracted.hasAnxiety)           profile.hasAnxiety     = true;
    if (extracted.isRescue)             profile.isRescue       = true;
    if (extracted.hasObedience)         profile.hasObedience   = true;
    // Location resolution
    if (extracted.zip && extracted.zip !== profile.zip) {
      profile.zip = extracted.zip;
      zipToCoords(extracted.zip).then(coords => {
        if (coords) {
          profile.userCity  = coords.city;
          profile.userState = coords.state;
          profile.closestTrainer = closestTrainer(coords.lat, coords.lon);
          log("Trainer: " + JSON.stringify(profile.closestTrainer));
        }
      });
    }
    log("Profile: " + JSON.stringify(profile));
  }

  const reply = await getAlmaReply();
  hideTyping();
  addBubble("alma", reply);
  history.push({ role: "assistant", content: reply });

  sendBtn.disabled = false;
  inputEl.focus();
}

// ── Input events ─────────────────────────────────────────────
sendBtn.addEventListener("click", send);
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "42px";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
});

// ── Opening message ──────────────────────────────────────────
(async () => {
  showTyping();
  await new Promise(r => setTimeout(r, 900));
  hideTyping();
  const opening = "Hey! I'm Alma from Dogwise Academy — thanks for reaching out. Tell me a bit about your dog. What's going on with them?";
  addBubble("alma", opening);
  history.push({ role: "assistant", content: opening });
  inputEl.focus();
})();
</script>
