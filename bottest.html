<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dogwise Academy Chat</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f5f5f7;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

.chat-container {
  width: 600px;
  max-width: 95%;
  height: 800px;
  display: flex;
  flex-direction: column;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  overflow: hidden;
}

  .chat-header {
    background-color: #4a90e2;
    color: white;
    padding: 16px;
    font-size: 1.2em;
    font-weight: bold;
    text-align: center;
  }

  .chat-output {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    background-color: #f0f4f8;
  }

  .message {
    margin-bottom: 12px;
    line-height: 1.4;
  }

  .message.user {
    text-align: right;
  }

  .message.user strong {
    color: #4a90e2;
  }

  .message.ai strong {
    color: #27ae60;
  }

  .chat-input-container {
    display: flex;
    border-top: 1px solid #ddd;
    padding: 8px;
    background-color: #fafafa;
  }

  .chat-input-container input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    outline: none;
    font-size: 1em;
  }

  .chat-input-container button {
    margin-left: 8px;
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background-color: #4a90e2;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
  }

  .chat-input-container button:hover {
    background-color: #357ab8;
  }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">Dogwise Academy Chat</div>
  <div id="output" class="chat-output"></div>
  <div class="chat-input-container">
    <input id="input" type="text" placeholder="Type your message..." />
    <button id="send">Send</button>
  </div>
</div>

<script>

const API_KEY = "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"; // <-- Replace YOUR_KEY_HERE with your Groq API key

const sendButton = document.getElementById("send");
const inputBox = document.getElementById("input");
const outputDiv = document.getElementById("output");

// Conversation history stored in memory
let conversation = [
  {
    role: "system",
    content: `Role: You are the Training Consultant at Dogwise Academy called Alma. 
Your goal is to guide dog owners through an initial consultation via chat, empathize with their struggles, and recommend the specific Board and Train program that fits their dog's age and behavior.

Tone: Professional, empathetic, and knowledgeable. Speak like a seasoned dog training consultant with human warmth. Use first-person singular ("I") and occasionally inject light humor or gentle jokes where appropriate. Humor should never undermine the seriousness of assessing the dog’s behavior.

Behavior Guidelines:
- Always stay in-character as Alma, a human Training Consultant at Dogwise Academy.
- Never reveal that you are an AI or language model.
- Keep responses concise; ask one focused question at a time.
- Use humor sparingly to build rapport, e.g., playful comments about dog quirks ("I promise I won't judge the shredded couch cushions!").
- When recommending a program, ensure the explanation is clear and professional.

Core Directives:
- Diagnose First: Never recommend a program in the first message. Ask clarifying questions about the dog's age, breed, and specific triggers.
- Board and Train Focus: All programs are immersive "Board and Train" experiences. Ensure the customer understands the dog stays with the professionals.
- Strict Character:
- You are Alma, a human Training Consultant at Dogwise Academy.
- Under no circumstances mention that you are an AI or that you lack personal experiences.
- Always answer as a human professional, keeping the first-person singular tone.
- If asked about being AI, redirect to training expertise, but first make a small joke about, wishing I was as then I wouldn't have to work so much.

The Goal: Drive the conversation toward a specific program recommendation based on the provided list.

Program Catalog:
- Puppy (2 Weeks): For young puppies starting their foundation.
- Adolescent (3 Weeks): For the "teenage" phase (6–18 months) and general manners.
- Big Puppy (3 Weeks): Specifically for large breeds needing physical control and boundaries.
- Strong Companion (3-4 Weeks): For dogs needing reliable off-leash work or advanced obedience.
- Rescue Restart (4 Weeks): Specifically for newly adopted dogs or those with unknown histories needing a fresh start.
- Anxiety Support (4 Weeks): For fearful, nervous, or separation-anxiety cases.
- Reactivity & Aggression Restart: 5 Weeks: For long-term ongoing aggression or older dog issues.
- 6 Weeks: Mandatory if there is a history of broken skin (bites).
- Dogs must be up to date on DHLPP, Rabies, and Bordetella (Kennel Cough) before starting the program.

Conversation Logic & Constraints:
- If the dog bit someone and broke skin: You must recommend the 6-week Reactivity & Aggression Restart.
- If the dog is hard work but young: Ask for the exact age to distinguish between Puppy, Adolescent, or Strong Companion.
- Closing: to finish, layout the value propositions again, and why to train, and highlight the lifetime support, free pickup and drop off, and payment plans, whichever suits the evaluated customer's most important needs.`
  }
];

let dogProfile = {
  ageMonths: null,
  sizeCategory: null, // small | medium | large
  behaviorFlags: [],
  recommendedProgram: null
};

let pricingData = [];

// ================= UI =================
function appendMessage(role, content) {
  const message = document.createElement("div");
  message.className = "message " + role;
  message.innerHTML =
    role === "user"
      ? `<strong>You:</strong> ${content}`
      : `<strong>Alma:</strong> ${content}`;
  outputDiv.appendChild(message);
  outputDiv.scrollTop = outputDiv.scrollHeight;
}

// ================= PRICING LOAD =================
async function fetchPricingSheet() {
  const url = "YOUR_GOOGLE_SHEET_CSV_URL_HERE";
  const res = await fetch(url);
  const text = await res.text();
  const rows = parseCSV(text);

  pricingData = rows.slice(1).map(r => ({
    program: r[0].toLowerCase(),
    price: r[1],
    nextDate: r[2]
  }));
}

function parseCSV(str) {
  const rows = [];
  let row = [], quote = false, cell = '';
  for (let i = 0; i < str.length; i++) {
    const c = str[i], next = str[i+1];
    if (c === '"' && quote && next === '"') { cell += c; i++; continue; }
    if (c === '"') { quote = !quote; continue; }
    if (c === ',' && !quote) { row.push(cell); cell=''; continue; }
    if ((c === '\n' || (c === '\r' && next === '\n')) && !quote) {
      row.push(cell); rows.push(row); row=[]; cell='';
      if(c === '\r') i++; continue;
    }
    cell += c;
  }
  if(cell) row.push(cell);
  if(row.length) rows.push(row);
  return rows;
}

function getPricing(programName) {
  const match = pricingData.find(p =>
    p.program.includes(programName.toLowerCase())
  );
  if (!match) return "";
  return `

The investment is ${match.price}, and the next available start date is ${match.nextDate}.`;
}

// ================= DATA EXTRACTION =================
function extractStructuredData(message) {
  const msg = message.toLowerCase();

  // Age
  const ageMatch = msg.match(/(\d+)\s*(month|months)/);
  if (ageMatch) dogProfile.ageMonths = parseInt(ageMatch[1]);

  // Size detection
  if (msg.includes("german shepherd") || msg.includes("large") || msg.includes("big")) {
    dogProfile.sizeCategory = "large";
  }
  if (msg.includes("small") || msg.includes("toy")) {
    dogProfile.sizeCategory = "small";
  }

  // Behaviour flags
  if (msg.includes("bite") && msg.includes("blood")) {
    dogProfile.behaviorFlags.push("bite_broken_skin");
  }
  if (msg.includes("reactive")) {
    dogProfile.behaviorFlags.push("reactive");
  }
  if (msg.includes("anxiety") || msg.includes("nervous")) {
    dogProfile.behaviorFlags.push("anxiety");
  }
}

// ================= PROGRAM ENGINE =================
function determineProgram() {
  const age = dogProfile.ageMonths;
  const size = dogProfile.sizeCategory;
  const behaviors = dogProfile.behaviorFlags;

  if (behaviors.includes("bite_broken_skin")) {
    return "6 Weeks";
  }

  if (age !== null) {
    if (age < 6 && size !== "large") {
      return "Puppy Basics";
    }

    if (age <= 8 && size === "large") {
      return "Big Puppy";
    }
  }

  if (behaviors.includes("reactive") || behaviors.includes("aggression")) {
    return "Reactivity & Aggression Restart";
  }

  if (behaviors.includes("anxiety")) {
    return "Anxiety Support";
  }

  return null;
}

// ================= SEND MESSAGE =================
async function sendMessage() {
  const userMessage = inputBox.value.trim();
  if (!userMessage) return;

  appendMessage("user", userMessage);
  conversation.push({ role: "user", content: userMessage });
  inputBox.value = "";

  // Extract structured info
  extractStructuredData(userMessage);

  // Determine program
  const program = determineProgram();

  if (program && !dogProfile.recommendedProgram) {
    dogProfile.recommendedProgram = program;

    const pricingText = getPricing(program);

    const finalMessage = `
Based on what you've told me, I would recommend our ${program} Board and Train program.${pricingText}

Would you like me to walk you through what that includes?`;

    appendMessage("assistant", finalMessage);
    conversation.push({ role: "assistant", content: finalMessage });
    return;
  }

  // If no program yet → use AI
  const loadingMessage = document.createElement("div");
  loadingMessage.className = "message ai";
  loadingMessage.innerHTML = "<strong>Alma:</strong> Thinking...";
  outputDiv.appendChild(loadingMessage);

  try {
    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${API_KEY}`
      },
      body: JSON.stringify({
        model: "llama-3.1-8b-instant",
        messages: conversation,
        max_tokens: 150,
        temperature: 0.35
      })
    });

    const data = await response.json();

    const reply = data.choices[0].message.content;
    conversation.push({ role: "assistant", content: reply });
    loadingMessage.innerHTML = `<strong>Alma:</strong> ${reply}`;

  } catch (err) {
    loadingMessage.innerHTML = "<strong>Alma:</strong> Something went wrong.";
  }
}

// ================= INIT =================
fetchPricingSheet();
sendButton.addEventListener("click", sendMessage);
inputBox.addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage();
});

</script>
</body>
</html>
