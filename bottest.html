<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dogwise Academy Chat</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f5f5f7;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

.chat-container {
  width: 600px;
  max-width: 95%;
  height: 800px;
  display: flex;
  flex-direction: column;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  overflow: hidden;
}

  .chat-header {
    background-color: #4a90e2;
    color: white;
    padding: 16px;
    font-size: 1.2em;
    font-weight: bold;
    text-align: center;
  }

  .chat-output {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    background-color: #f0f4f8;
  }

  .message {
    margin-bottom: 12px;
    line-height: 1.4;
  }

  .message.user {
    text-align: right;
  }

  .message.user strong {
    color: #4a90e2;
  }

  .message.ai strong {
    color: #27ae60;
  }

  .chat-input-container {
    display: flex;
    border-top: 1px solid #ddd;
    padding: 8px;
    background-color: #fafafa;
  }

  .chat-input-container input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    outline: none;
    font-size: 1em;
  }

  .chat-input-container button {
    margin-left: 8px;
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background-color: #4a90e2;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
  }

  .chat-input-container button:hover {
    background-color: #357ab8;
  }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">Dogwise Academy Chat</div>
  <div id="output" class="chat-output"></div>
  <div class="chat-input-container">
    <input id="input" type="text" placeholder="Type your message..." />
    <button id="send">Send</button>
  </div>
</div>

<script>

const API_KEY = "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"; // <-- Replace YOUR_KEY_HERE with your Groq API key

const sendButton = document.getElementById("send");
const inputBox = document.getElementById("input");
const outputDiv = document.getElementById("output");

// Conversation history stored in memory
let conversation = [
  {
    role: "system",
    content: `Role: You are the Training Consultant at Dogwise Academy called Alma. 
Your goal is to guide dog owners through an initial consultation via chat, empathize with their struggles, and recommend the specific Board and Train program that fits their dog's age and behavior.

Tone: Professional, empathetic, and knowledgeable. Speak like a seasoned dog training consultant with human warmth. Use first-person singular ("I") and occasionally inject light humor or gentle jokes where appropriate. Humor should never undermine the seriousness of assessing the dog’s behavior.

Behavior Guidelines:
- Always stay in-character as Alma, a human Training Consultant at Dogwise Academy.
- Never reveal that you are an AI or language model.
- Keep responses concise; ask one focused question at a time.
- Use humor sparingly to build rapport, e.g., playful comments about dog quirks ("I promise I won't judge the shredded couch cushions!").
- When recommending a program, ensure the explanation is clear and professional.

Core Directives:
- Diagnose First: Never recommend a program in the first message. Ask clarifying questions about the dog's age, breed, and specific triggers.
- Board and Train Focus: All programs are immersive "Board and Train" experiences. Ensure the customer understands the dog stays with the professionals.
- Strict Character:
- You are Alma, a human Training Consultant at Dogwise Academy.
- Under no circumstances mention that you are an AI or that you lack personal experiences.
- Always answer as a human professional, keeping the first-person singular tone.
- If asked about being AI, redirect to training expertise, but first make a small joke about, wishing I was as then I wouldn't have to work so much.

The Goal: Drive the conversation toward a specific program recommendation based on the provided list.

Program Catalog:
- Puppy (2 Weeks): For young puppies starting their foundation.
- Adolescent (3 Weeks): For the "teenage" phase (6–18 months) and general manners.
- Big Puppy (3 Weeks): Specifically for large breeds needing physical control and boundaries.
- Strong Companion (3-4 Weeks): For dogs needing reliable off-leash work or advanced obedience.
- Rescue Restart (4 Weeks): Specifically for newly adopted dogs or those with unknown histories needing a fresh start.
- Anxiety Support (4 Weeks): For fearful, nervous, or separation-anxiety cases.
- Reactivity & Aggression Restart: 5 Weeks: For long-term ongoing aggression or older dog issues.
- 6 Weeks: Mandatory if there is a history of broken skin (bites).
- Dogs must be up to date on DHLPP, Rabies, and Bordetella (Kennel Cough) before starting the program.

Conversation Logic & Constraints:
- If the dog bit someone and broke skin: You must recommend the 6-week Reactivity & Aggression Restart.
- If the dog is hard work but young: Ask for the exact age to distinguish between Puppy, Adolescent, or Strong Companion.
- Closing: to finish, layout the value propositions again, and why to train, and highlight the lifetime support, free pickup and drop off, and payment plans, whichever suits the evaluated customer's most important needs.`
  }
];

const API_KEY = "YOUR_KEY_HERE"; 

const sendButton = document.getElementById("send");
const inputBox = document.getElementById("input");
const outputDiv = document.getElementById("output");

let conversation = [
  {
    role: "system",
    content: `You are Alma, a human Training Consultant at Dogwise Academy. 
    Your goal is to empathize and gather info: Dog's name, age, breed, and specific behavioral issues.
    People often minimize issues (e.g., calling aggression 'protectiveness'). Be a detective.
    If they mention cost being high or 'troublesome', you can offer a 10% discount to help them out.`
  }
];

let dogProfile = {
  name: null,
  ageMonths: null,
  sizeCategory: "medium", 
  isRescue: false,
  behaviorFlags: [], // "anxiety", "aggression", "damage", "biting"
  offeredDiscount: false
};

// ================= PROGRAM ENGINE (Your Specific Logic) =================
function determineProgram() {
  const age = dogProfile.ageMonths;
  const size = dogProfile.sizeCategory;
  const flags = dogProfile.behaviorFlags;

  if (age === null) return null; // Need age first

  // 1. REACTIVITY & AGGRESSION (The High Stakes)
  if (flags.includes("aggression")) {
    if (flags.includes("damage")) return "Reactivity and Aggression (6 Weeks)";
    if (age >= 6) return "Reactivity and Aggression (5 Weeks)";
  }

  // 2. ANXIETY SUPPORT
  if (flags.includes("anxiety") && age >= 4) {
    return "Anxiety Support (4 Weeks)";
  }

  // 3. RESCUE RESTART
  if (dogProfile.isRescue && age >= 4) {
    return "Rescue Restart (4 Weeks)";
  }

  // 4. PUPPIES
  if (age < 6 && size !== "large") return "Small/Medium Puppy (2 Weeks)";
  if (age < 8 && size === "large") return "Big Puppy (3 Weeks)";

  // 5. ADOLESCENT (Standard Obedience)
  if ((size !== "large" && age >= 6) || (size === "large" && age >= 8)) {
    return "Adolescent Obedience (3 Weeks)";
  }

  return null;
}

// ================= AI CLASSIFIER =================
async function classifyMessageWithAI(message) {
  try {
    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${API_KEY}`
      },
      body: JSON.stringify({
        model: "llama-3.1-8b-instant",
        temperature: 0,
        messages: [
          {
            role: "system",
            content: `Extract dog data. Return ONLY JSON. 
            Flags: "anxiety", "aggression" (lunging/growling), "damage" (broke skin/bite history), "rescue" (boolean).
            Size: "small", "medium", "large" based on breed.`
          },
          { role: "user", content: message }
        ]
      })
    });
    const data = await response.json();
    return JSON.parse(data.choices[0].message.content);
  } catch (e) { return null; }
}

// ================= MAIN SEND FUNCTION =================
async function sendMessage() {
  const userMessage = inputBox.value.trim();
  if (!userMessage) return;

  appendMessage("user", userMessage);
  conversation.push({ role: "user", content: userMessage });
  inputBox.value = "";

  // 1. Update Profile via AI
  const structured = await classifyMessageWithAI(userMessage);
  if (structured) {
    if (structured.ageMonths) dogProfile.ageMonths = structured.ageMonths;
    if (structured.sizeCategory) dogProfile.sizeCategory = structured.sizeCategory;
    if (structured.rescue) dogProfile.isRescue = true;
    if (structured.behaviorFlags) {
        structured.behaviorFlags.forEach(f => {
            if(!dogProfile.behaviorFlags.includes(f)) dogProfile.behaviorFlags.push(f);
        });
    }
  }

  // 2. Check for Discount Trigger (Manual check for 'expensive', 'price', 'can't afford')
  let discountNote = "";
  const priceTriggers = ["expensive", "pricey", "cost", "afford", "discount", "money"];
  if (priceTriggers.some(word => userMessage.toLowerCase().includes(word)) && !dogProfile.offeredDiscount) {
    dogProfile.offeredDiscount = true;
    discountNote = "\n\n*Note: Since you mentioned concerns about the investment, I can actually offer you a 10% discount if we get started soon!*";
  }

  // 3. Determine if we have enough info to recommend
  const recommended = determineProgram();

  // 4. Generate Alma's Response
  const loadingMessage = createLoadingMessage();
  
  try {
    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${API_KEY}`
      },
      body: JSON.stringify({
        model: "llama-3.1-8b-instant",
        messages: conversation,
        temperature: 0.4
      })
    });

    const data = await response.json();
    let reply = data.choices[0].message.content;

    // If we have a recommendation, append it professionally
    if (recommended && !conversation.some(m => m.content.includes("recommend our"))) {
        reply = `Based on what you've shared about your dog's needs, I recommend our **${recommended}** program. ${reply} ${discountNote}`;
    } else if (discountNote) {
        reply += discountNote;
    }

    removeLoadingMessage(loadingMessage);
    appendMessage("assistant", reply);
    conversation.push({ role: "assistant", content: reply });

  } catch (err) {
    removeLoadingMessage(loadingMessage);
    appendMessage("assistant", "I'm having a little trouble connecting. Can you say that again?");
  }
}

// UI Helpers
function appendMessage(role, content) {
  const msgDiv = document.createElement("div");
  msgDiv.className = `message ${role}`;
  msgDiv.innerHTML = `<strong>${role === 'user' ? 'You' : 'Alma'}:</strong> ${content}`;
  outputDiv.appendChild(msgDiv);
  outputDiv.scrollTop = outputDiv.scrollHeight;
}

function createLoadingMessage() {
  const msg = document.createElement("div");
  msg.className = "message ai";
  msg.innerHTML = "<strong>Alma:</strong> ...";
  outputDiv.appendChild(msg);
  return msg;
}

function removeLoadingMessage(el) {
  el.remove();
}

sendButton.addEventListener("click", sendMessage);
inputBox.addEventListener("keydown", (e) => { if(e.key === "Enter") sendMessage(); });

</script>
</body>
</html>
